name: CI/CD MLflow

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


env:
  CSV_URL: "MLProject/hasil_Preprocessing_gojek.csv"


jobs:

  train-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. SETUP PYTHON
      # ======================================================

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"


      # ======================================================
      # 3. SETUP CONDA
      # ======================================================

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: MLProject/conda.yaml
          activate-environment: gojek-sentiment-mlflow
          auto-activate-base: false
          python-version: 3.12.7


      # ======================================================
      # 4. CHECK ENVIRONMENT
      # ======================================================

      - name: Check environment
        shell: bash -el {0}
        run: |
          conda activate gojek-sentiment-mlflow

          echo "Python:"
          python --version

          echo ""
          echo "MLflow:"
          mlflow --version

          echo ""
          echo "Pip:"
          pip --version


      # ======================================================
      # 5. RUN MLFLOW PROJECT
      # ======================================================

      - name: Run MLflow Project
        shell: bash -el {0}
        run: |
          conda activate gojek-sentiment-mlflow

          cd MLProject

          mlflow run . \
            -P data_path=hasil_Preprocessing_gojek.csv \
            --env-manager=local


      # ======================================================
      # 6. INSPECT MLFLOW ARTIFACTS
      # ======================================================

      - name: Inspect MLflow artifacts
        run: |
          echo "=========================================="
          echo "MLFLOW DIRECTORY"
          echo "=========================================="

          if [ ! -d "MLProject/mlruns" ]; then
            echo "ERROR: MLProject/mlruns tidak ditemukan."
            exit 1
          fi

          find MLProject/mlruns \
            -maxdepth 7 \
            -print


      # ======================================================
      # 7. FIND MODEL
      # ======================================================

      - name: Find MLflow model
        shell: bash -el {0}
        run: |

          echo "=========================================="
          echo "SEARCHING MLFLOW MODEL"
          echo "=========================================="

          MODEL_PATH=$(find MLProject/mlruns \
            -type d \
            -path "*/artifacts/model" \
            | head -n 1)

          if [ -z "$MODEL_PATH" ]; then

            echo "ERROR: Model MLflow tidak ditemukan."

            echo ""
            echo "Isi MLflow directory:"
            find MLProject/mlruns \
              -maxdepth 8 \
              -print

            exit 1
          fi

          echo "Model ditemukan:"
          echo "$MODEL_PATH"

          echo "MODEL_PATH=$MODEL_PATH" >> "$GITHUB_ENV"


          # --------------------------------------------------
          # Ambil RUN_ID dari path
          # --------------------------------------------------

          RUN_ID=$(echo "$MODEL_PATH" \
            | sed -E 's#^.*/mlruns/[^/]+/([^/]+)/artifacts/model$#\1#')

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: RUN_ID gagal ditemukan."
            exit 1
          fi

          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

          echo ""
          echo "RUN_ID:"
          echo "$RUN_ID"

          echo ""
          echo "MODEL_PATH:"
          echo "$MODEL_PATH"


      # ======================================================
      # 8. VERIFY MODEL
      # ======================================================

      - name: Verify MLflow model
        run: |

          echo "=========================================="
          echo "VERIFY MODEL"
          echo "=========================================="

          echo "RUN_ID=$RUN_ID"
          echo "MODEL_PATH=$MODEL_PATH"

          if [ ! -d "$MODEL_PATH" ]; then
            echo "ERROR: Model tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "Model ditemukan."

          echo ""
          echo "Isi model:"
          ls -lah "$MODEL_PATH"

          echo ""
          echo "MLmodel:"
          cat "$MODEL_PATH/MLmodel"


      # ======================================================
      # 9. PUSH MLFLOW ARTIFACTS TO GITHUB
      # ======================================================

      - name: Push MLflow artifacts
        run: |

          echo "=========================================="
          echo "PUSH MLFLOW ARTIFACTS"
          echo "=========================================="

          git config --global user.name \
            "${{ secrets.GIT_USERNAME }}"

          git config --global user.email \
            "${{ secrets.GIT_EMAIL }}"

          git remote set-url origin \
            https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git

          git add MLProject/mlruns

          git commit \
            -m "Save MLflow run artifacts [skip ci]" \
            || echo "No changes to commit"

          git push origin main


      # ======================================================
      # 10. BUILD DOCKER IMAGE
      # ======================================================

      - name: Build Docker Image
        shell: bash -el {0}
        run: |

          conda activate gojek-sentiment-mlflow

          echo "=========================================="
          echo "BUILD DOCKER IMAGE"
          echo "=========================================="

          echo "Model path:"
          echo "$MODEL_PATH"

          mlflow models build-docker \
            --model-uri "file://$GITHUB_WORKSPACE/$MODEL_PATH" \
            --name gojek-sentiment

          echo ""
          echo "Docker image berhasil dibuat."

          docker images


      # ======================================================
      # 11. LOGIN DOCKER HUB
      # ======================================================

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}


      # ======================================================
      # 12. TAG DOCKER IMAGE
      # ======================================================

      - name: Tag Docker Image
        run: |

          echo "=========================================="
          echo "TAG DOCKER IMAGE"
          echo "=========================================="

          docker tag \
            gojek-sentiment \
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO }}:latest

          echo "Image:"
          echo "${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO }}:latest"


      # ======================================================
      # 13. PUSH DOCKER IMAGE
      # ======================================================

      - name: Push Docker Image
        run: |

          echo "=========================================="
          echo "PUSH DOCKER IMAGE"
          echo "=========================================="

          docker push \
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO }}:latest

          echo ""
          echo "Docker image berhasil di-push ke Docker Hub."
